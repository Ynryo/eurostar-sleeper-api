services:
  eurostar-sleeper-radar:
    build: .
    container_name: eurostar-sleeper-radar
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - TZ=Europe/Paris
    networks:
      - spotted-network

networks:
  spotted-network:
    external: true
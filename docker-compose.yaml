services:
  eurostar-sleeper-api:
    container_name: eurostar-sleeper-api
    build: .
    command: ["python", "-m", "app.main"]
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - TZ=Europe/Paris
    networks:
      - spotted-network

networks:
  spotted-network:
    external: true
